{% extends "base.html" %}

{% block content %}
<div class="game">
  <section>
    <div id="offline" class="banner" hidden>⚠️ Can't reach the game server. Retrying…</div>
    <div id="status" class="status">Loading…</div>
    <div class="board-wrap">
      <div id="board" class="board" style="grid-template-columns: repeat({{ cols }}, 1fr)">
        {% for r in range(rows) %}
          {% for c in range(cols) %}
            <button class="cell empty" data-row="{{ r }}" data-col="{{ c }}" aria-label="Column {{ c + 1 }}"></button>
          {% endfor %}
        {% endfor %}
      </div>
      <div class="board-stand"></div>
    </div>
  </section>

  <aside class="sidebar">
    <div class="card">
      <p class="eyebrow">Players</p>
      <div class="players">
        <div id="player-red" class="player red">
          <span class="disc red"></span>
          <div><div class="name">Red</div><div class="sub">Open seat</div></div>
        </div>
        <div id="player-yellow" class="player yellow">
          <span class="disc yellow"></span>
          <div><div class="name">Yellow</div><div class="sub">Open seat</div></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="join" class="btn primary big" hidden>Join game</button>
      <button id="reset" class="btn" hidden>New game</button>
      <button id="leave" class="btn" hidden>Leave seat</button>
    </div>
    <p id="error" class="error"></p>

    <div class="card">
      <h3>Moves</h3>
      <ol id="moves" class="moves"></ol>
    </div>
  </aside>
</div>
{% endblock %}

{% block scripts %}
<script>
  const boardEl = document.getElementById("board");
  const cells = [...boardEl.querySelectorAll(".cell")];
  let state = null;

  const name = (color) => color[0].toUpperCase() + color.slice(1);

  async function api(path, body) {
    const opts = body === undefined ? {} : {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    };
    let res;
    try {
      res = await fetch(path, { ...opts, signal: AbortSignal.timeout(8000) });
    } catch (e) {
      throw new OfflineError("Can't reach the game server. Check your connection and try again.");
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* not JSON, e.g. a proxy error page */ }
    if (!res.ok || !data) {
      throw new Error(data?.error || `The server had a problem (error ${res.status}). Please try again.`);
    }
    return data;
  }

  class OfflineError extends Error {}

  function setOffline(offline) {
    document.getElementById("offline").hidden = !offline;
  }

  function render(s) {
    // Only animate when exactly one new move arrived (not on first load or reset).
    const isNewMove = state && s.moves.length === state.moves.length + 1;
    state = s;

    const ready = s.seats.red && s.seats.yellow;
    const myTurn = s.you && ready && !s.winner && s.turn === s.you;
    const last = s.moves[s.moves.length - 1];
    const winSet = new Set(s.winning_cells.map(([r, c]) => `${r},${c}`));

    cells.forEach((cell) => {
      const r = +cell.dataset.row, c = +cell.dataset.col;
      const v = s.board[r][c];
      const isLast = last && last.row === r && last.col === c;
      cell.classList.toggle("empty", !v);
      cell.classList.toggle("win", winSet.has(`${r},${c}`));
      cell.classList.toggle("last", !!isLast);

      const disc = cell.querySelector(".disc");
      if (!v) { if (disc) disc.remove(); return; }
      if (disc && disc.classList.contains(v)) return;
      if (disc) disc.remove();
      const d = document.createElement("span");
      d.className = `disc ${v}`;
      if (isLast && isNewMove) {
        d.style.setProperty("--row", r);
        d.classList.add("drop");
      }
      cell.appendChild(d);
    });
    boardEl.classList.toggle("my-turn", !!myTurn);

    const statusEl = document.getElementById("status");
    let text, color = null;
    if (s.winner === "draw") text = "It's a draw!";
    else if (s.winner) { text = s.winner === s.you ? "You win! 🎉" : `${name(s.winner)} wins!`; color = s.winner; }
    else if (!ready) text = "Waiting for two players…";
    else { text = myTurn ? "Your turn — pick a column" : `${name(s.turn)}'s turn`; color = s.turn; }
    statusEl.className = "status" + (color ? ` turn-${color}` : "") + (s.winner && s.winner !== "draw" ? " win" : "");
    statusEl.innerHTML = (color ? `<span class="disc ${color}"></span>` : "") + text;

    for (const color of ["red", "yellow"]) {
      const el = document.getElementById(`player-${color}`);
      el.classList.toggle("active", ready && !s.winner && s.turn === color);
      el.querySelector(".sub").textContent = s.seats[color] ? "Ready" : "Open seat";
      el.querySelector(".tag")?.remove();
      if (s.you === color) el.insertAdjacentHTML("beforeend", `<span class="tag">You</span>`);
    }

    const openSeat = !s.seats.red || !s.seats.yellow;
    document.getElementById("join").hidden = !!s.you || !openSeat;
    document.getElementById("reset").hidden = !s.you;
    document.getElementById("leave").hidden = !s.you;

    const movesEl = document.getElementById("moves");
    movesEl.innerHTML = s.moves.length
      ? s.moves.map((m, i) => `<li><span class="num">${i + 1}.</span><span class="disc ${m.player}"></span>${name(m.player)} → column ${m.col + 1}</li>`).join("")
      : `<li class="empty-note">No moves yet.</li>`;
    movesEl.scrollTop = movesEl.scrollHeight;
  }

  async function poll() {
    try {
      const s = await api("/api/state");
      setOffline(false);
      if (!state || s.version !== state.version || s.you !== state.you) render(s);
    } catch (e) {
      setOffline(e instanceof OfflineError);
      if (!state) document.getElementById("status").textContent = "Couldn't load the game. Retrying…";
    }
  }

  async function act(path, body = {}) {
    const errEl = document.getElementById("error");
    errEl.textContent = "";
    try {
      render(await api(path, body));
      setOffline(false);
    } catch (e) {
      errEl.textContent = e.message;
    }
  }

  boardEl.addEventListener("click", (e) => {
    const cell = e.target.closest(".cell");
    if (cell) act("/api/move", { col: +cell.dataset.col });
  });
  boardEl.addEventListener("mouseover", (e) => {
    const cell = e.target.closest(".cell");
    cells.forEach((c) => c.classList.toggle("col-hover", !!cell && c.dataset.col === cell.dataset.col));
  });
  boardEl.addEventListener("mouseleave", () => cells.forEach((c) => c.classList.remove("col-hover")));

  document.getElementById("join").addEventListener("click", () => act("/api/join"));
  document.getElementById("reset").addEventListener("click", () => act("/api/reset"));
  document.getElementById("leave").addEventListener("click", () => act("/api/leave"));

  poll();
  setInterval(poll, 1000);
</script>
{% endblock %}
